<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="280" height="126">
  <style>
    /* === Shared Bounce === */
    @keyframes jump {
      0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
      30% { transform: translateY(-16px) scaleY(1.1) scaleX(0.95); }
      50% { transform: translateY(-18px) scaleY(1.05) scaleX(0.98); }
      80% { transform: translateY(-5px) scaleY(0.95) scaleX(1.05); }
    }
    @keyframes shadow-scale {
      0%, 100% { transform: scaleX(1); opacity: 0.25; }
      50% { transform: scaleX(0.4); opacity: 0.08; }
    }

    /* === Claude Animations === */
    @keyframes wave-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    @keyframes wave-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }
    @keyframes ear-bounce {
      0%, 100% { transform: scaleY(1); }
      40% { transform: scaleY(1.2); }
      60% { transform: scaleY(0.85); }
    }

    /* === Ghostty: Glitchy ghost float (CRT-style jitter) === */
    @keyframes ghost-glitch-float {
      0%    { transform: translateY(0px); }
      3%    { transform: translateY(-2px); }
      5%    { transform: translateY(1px); }
      8%    { transform: translateY(-4px); }
      10%   { transform: translateY(-1px); }
      14%   { transform: translateY(-3px); }
      16%   { transform: translateY(0px); }
      20%   { transform: translateY(-2px); }
      22%   { transform: translateY(-5px); }
      25%   { transform: translateY(-1px); }
      28%   { transform: translateY(-3px); }
      32%   { transform: translateY(0px); }
      35%   { transform: translateY(-2px); }
      38%   { transform: translateY(-4px); }
      40%   { transform: translateY(-1px); }
      50%   { transform: translateY(-2px); }
      55%   { transform: translateY(-5px); }
      60%   { transform: translateY(-1px); }
      65%   { transform: translateY(-3px); }
      70%   { transform: translateY(1px); }
      75%   { transform: translateY(-2px); }
      80%   { transform: translateY(-4px); }
      85%   { transform: translateY(0px); }
      90%   { transform: translateY(-3px); }
      95%   { transform: translateY(1px); }
      100%  { transform: translateY(0px); }
    }

    /* === Ghostty: Gentle Y-axis rotation (scaleX, never full flip) === */
    @keyframes ghost-spin {
      0%   { transform: scaleX(1); }
      12%  { transform: scaleX(0.4); }
      25%  { transform: scaleX(0.85); }
      37%  { transform: scaleX(0.4); }
      50%  { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }

    /* === Ghostty: Face partial fade during rotation === */
    @keyframes ghost-face {
      0%   { opacity: 1; }
      10%  { opacity: 0.3; }
      25%  { opacity: 0.6; }
      35%  { opacity: 0.3; }
      50%  { opacity: 1; }
      100% { opacity: 1; }
    }

    /* === Ghostty: Expression cycling (opacity swap, synced to 4s spin) === */
    /* Terminal eyes >_ and - : visible 0-10% (before spin) and 70-100% (frontal pause) */
    @keyframes expr-terminal-cycle {
      0%   { opacity: 1; }
      10%  { opacity: 1; }
      12%  { opacity: 0; }
      48%  { opacity: 0; }
      50%  { opacity: 0; }
      65%  { opacity: 0; }
      70%  { opacity: 1; }
      100% { opacity: 1; }
    }
    /* Blink/dash eyes: visible 12-48% (during spin) and brief 65-67% (quick blink) */
    @keyframes expr-blink-cycle {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      48%  { opacity: 1; }
      50%  { opacity: 0; }
      64%  { opacity: 0; }
      65%  { opacity: 1; }
      67%  { opacity: 0; }
      100% { opacity: 0; }
    }
    /* Open round eyes: visible 50-64% (after spin, frontal pause) */
    @keyframes expr-open-cycle {
      0%   { opacity: 0; }
      48%  { opacity: 0; }
      50%  { opacity: 1; }
      64%  { opacity: 1; }
      65%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes ghost-wobble {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(3px); }
      70% { transform: translateX(-3px); }
    }
    @keyframes blink-cursor {
      0%, 49% { opacity: 1; }
      50%, 99% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* === Claude Body === */
    .claude-body {
      animation: jump 0.5s ease-in-out infinite;
      transform-origin: 50px 82px;
    }
    .claude-shadow {
      animation: shadow-scale 0.5s ease-in-out infinite;
      transform-origin: 50px 92px;
    }
    .left-arm {
      animation: wave-left 0.5s ease-in-out infinite;
      transform-origin: right center;
    }
    .right-arm {
      animation: wave-right 0.5s ease-in-out infinite 0.04s;
      transform-origin: left center;
    }
    .left-ear {
      animation: ear-bounce 0.5s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .right-ear {
      animation: ear-bounce 0.5s ease-in-out infinite 0.1s;
      transform-origin: center bottom;
    }

    /* === Ghostty Body === */
    .ghostty-body {
      animation: ghost-glitch-float 0.8s step-end infinite;
      transform-origin: 164px 82px;
    }
    .ghostty-spin {
      animation: ghost-spin 4s ease-in-out infinite;
      transform-origin: 164px 50px;
    }
    .ghostty-shadow {
      animation: shadow-scale 0.5s ease-in-out infinite 0.08s;
      transform-origin: 164px 92px;
    }
    .ghostty-tentacles {
      animation: ghost-wobble 0.5s ease-in-out infinite 0.08s;
      transform-origin: center top;
    }
    .ghostty-face {
      animation: ghost-face 4s ease-in-out infinite;
    }
    .expr-terminal {
      animation: expr-terminal-cycle 4s ease-in-out infinite;
    }
    .expr-blink {
      opacity: 0;
      animation: expr-blink-cycle 4s ease-in-out infinite;
    }
    .expr-open {
      opacity: 0;
      animation: expr-open-cycle 4s ease-in-out infinite;
    }
    .terminal-cursor {
      animation: blink-cursor 1s linear infinite;
    }
  </style>

  <!-- ==================== -->
  <!-- CHARACTER 1: CLAUDE  -->
  <!-- ==================== -->

  <!-- Shadow -->
  <ellipse class="claude-shadow" cx="50" cy="92" rx="22" ry="5" fill="#000"/>

  <!-- Claude Character -->
  <g class="claude-body">
    <!-- Left ear -->
    <rect class="left-ear" x="22" y="16" width="8" height="16" fill="#E07C4C"/>
    <!-- Right ear -->
    <rect class="right-ear" x="70" y="16" width="8" height="16" fill="#E07C4C"/>
    <!-- Body top (narrower) -->
    <rect x="18" y="32" width="64" height="4" fill="#E07C4C"/>
    <!-- Body main -->
    <rect x="14" y="36" width="72" height="32" fill="#E07C4C"/>
    <!-- Left eye -->
    <rect x="30" y="42" width="8" height="10" fill="#000000"/>
    <!-- Right eye -->
    <rect x="62" y="42" width="8" height="10" fill="#000000"/>
    <!-- Left arm -->
    <rect class="left-arm" x="2" y="44" width="12" height="8" fill="#E07C4C"/>
    <!-- Right arm -->
    <rect class="right-arm" x="86" y="44" width="12" height="8" fill="#E07C4C"/>
    <!-- Left leg -->
    <rect x="24" y="68" width="12" height="14" fill="#E07C4C"/>
    <!-- Right leg -->
    <rect x="64" y="68" width="12" height="14" fill="#E07C4C"/>
  </g>

  <!-- ==================== -->
  <!-- CHARACTER 2: GHOSTTY -->
  <!-- ==================== -->

  <!-- Shadow -->
  <ellipse class="ghostty-shadow" cx="164" cy="92" rx="24" ry="5" fill="#000"/>

  <!-- Ghostty Character -->
  <g class="ghostty-body">
    <g class="ghostty-spin">
      <!-- Dome row 1 -->
      <rect x="152" y="16" width="24" height="4" fill="#E8EAED"/>
      <!-- Dome row 2 -->
      <rect x="148" y="20" width="32" height="4" fill="#E8EAED"/>
      <!-- Dome row 3 -->
      <rect x="144" y="24" width="40" height="4" fill="#E8EAED"/>
      <!-- Dome row 4 -->
      <rect x="140" y="28" width="48" height="4" fill="#E8EAED"/>
      <!-- Head -->
      <rect x="136" y="32" width="56" height="12" fill="#E8EAED"/>
      <!-- Body -->
      <rect x="136" y="44" width="56" height="20" fill="#E8EAED"/>
      <!-- Tentacles -->
      <g class="ghostty-tentacles">
        <rect x="136" y="64" width="12" height="10" fill="#E8EAED"/>
        <rect x="152" y="64" width="12" height="16" fill="#E8EAED"/>
        <rect x="168" y="64" width="12" height="10" fill="#E8EAED"/>
        <rect x="184" y="64" width="8" height="16" fill="#E8EAED"/>
      </g>

      <!-- Ghost silhouette outline -->
      <path d="
        M152,16 h24
        v4 h4
        v4 h4
        v4 h4
        v4 h4
        v32
        v16 h-8 v-16
        h-4
        v10 h-12 v-10
        h-4
        v16 h-12 v-16
        h-4
        v10 h-12 v-10
        v-32
        h4 v-4
        h4 v-4
        h4 v-4
        h4 v-4
        Z"
        fill="none" stroke="#B0B8C0" stroke-width="1" stroke-linejoin="miter"/>

      <!-- Face: three expression states, opacity-cycled -->
      <g class="ghostty-face">

        <!-- Expression 1: Terminal eyes (>_ left, - right) — DEFAULT -->
        <g class="expr-terminal">
          <!-- Left eye: > chevron -->
          <rect x="148" y="36" width="4" height="4" fill="#000"/>
          <rect x="152" y="40" width="4" height="4" fill="#000"/>
          <rect x="148" y="44" width="4" height="4" fill="#000"/>
          <!-- _ underscore -->
          <rect x="156" y="44" width="4" height="4" fill="#000"/>
          <!-- Blinking cursor -->
          <rect class="terminal-cursor" x="160" y="44" width="4" height="4" fill="#000"/>
          <!-- Right eye: - dash -->
          <rect x="172" y="40" width="8" height="4" fill="#000"/>
        </g>

        <!-- Expression 2: Blink/dash eyes (during rotation) -->
        <g class="expr-blink">
          <rect x="148" y="40" width="12" height="4" fill="#000"/>
          <rect x="172" y="40" width="8" height="4" fill="#000"/>
        </g>

        <!-- Expression 3: Open round eyes (after rotation) -->
        <g class="expr-open">
          <rect x="148" y="36" width="8" height="10" fill="#000"/>
          <rect x="172" y="36" width="8" height="10" fill="#000"/>
        </g>

      </g>
    </g>
  </g>
</svg>
