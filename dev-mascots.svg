    <!-- Body top (shoulder) -->
    <rect x="180" y="40" width="40" height="3" fill="#E07C4C"/>
    <!-- Body main -->
    <rect x="177" y="43" width="46" height="22" fill="#E07C4C"/>
    <!-- Left eye -->
    <rect x="187" y="47" width="6" height="7" fill="#1C1E26"/>
    <!-- Right eye -->
    <rect x="207" y="47" width="6" height="7" fill="#1C1E26"/>
    <!-- Left arm -->
    <rect class="main-left-arm" x="169" y="48" width="8" height="5" fill="#E07C4C"/>
    <!-- Right arm -->
    <rect class="main-right-arm" x="223" y="48" width="8" height="5" fill="#E07C4C"/>
    <!-- Left leg -->
    <rect x="185" y="65" width="8" height="10" fill="#E07C4C"/>
    <!-- Right leg -->
    <rect x="207" y="65" width="8" height="10" fill="#E07C4C"/>
  </g>

  <!-- ======================== -->
  <!-- SUBAGENT 1: explore      -->
  <!-- ======================== -->
  <ellipse class="sub-shadow-1" cx="60" cy="152" rx="12" ry="2" fill="#000"/>
  <g class="sub-1">
    <!-- Ears -->
    <rect x="51" y="120" width="4" height="6" fill="#E8A070"/>
    <rect x="65" y="120" width="4" height="6" fill="#E8A070"/>
    <!-- Shoulder -->
    <rect x="50" y="126" width="20" height="2" fill="#E8A070"/>
    <!-- Body -->
    <rect x="48" y="128" width="24" height="12" fill="#E8A070"/>
    <!-- Eyes -->
    <rect x="53" y="131" width="4" height="4" fill="#1C1E26"/>
    <rect x="63" y="131" width="4" height="4" fill="#1C1E26"/>
    <!-- Arms -->
    <rect x="43" y="132" width="5" height="3" fill="#E8A070"/>
    <rect x="72" y="132" width="5" height="3" fill="#E8A070"/>
    <!-- Legs -->
    <rect x="53" y="140" width="5" height="7" fill="#E8A070"/>
    <rect x="62" y="140" width="5" height="7" fill="#E8A070"/>
    <!-- Status dot -->
    <circle class="status-dot sd-1" cx="76" cy="123" r="2.5" fill="#50FA7B"/>
