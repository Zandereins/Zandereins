<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="480" height="216">
  <style>
    /* === Animations === */

    /* Claude main agent bounce */
    @keyframes jump {
      0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
      30% { transform: translateY(-10px) scaleY(1.08) scaleX(0.96); }
      50% { transform: translateY(-12px) scaleY(1.04) scaleX(0.98); }
      80% { transform: translateY(-3px) scaleY(0.96) scaleX(1.04); }
    }
    @keyframes wave-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    @keyframes wave-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }
    @keyframes ear-bounce {
      0%, 100% { transform: scaleY(1); }
      40% { transform: scaleY(1.2); }
      60% { transform: scaleY(0.85); }
    }

    /* Subagent bounce (smaller) */
    @keyframes sub-jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Connection line dash flow */
    @keyframes dash-flow {
      0% { stroke-dashoffset: 16; }
      100% { stroke-dashoffset: 0; }
    }

    /* Status dot pulse */
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* === Main Agent === */
    .claude-main {
      animation: jump 0.7s ease-in-out infinite;
      transform-origin: 200px 62px;
    }
    .main-left-arm {
      animation: wave-left 0.7s ease-in-out infinite;
      transform-origin: right center;
    }
    .main-right-arm {
      animation: wave-right 0.7s ease-in-out infinite 0.05s;
      transform-origin: left center;
    }
    .main-left-ear {
      animation: ear-bounce 0.7s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .main-right-ear {
      animation: ear-bounce 0.7s ease-in-out infinite 0.1s;
      transform-origin: center bottom;
    }

    /* === Subagents === */
    .sub-1 { animation: sub-jump 0.6s ease-in-out infinite; transform-origin: 60px 140px; }
    .sub-2 { animation: sub-jump 0.6s ease-in-out infinite 0.12s; transform-origin: 130px 140px; }
    .sub-3 { animation: sub-jump 0.6s ease-in-out infinite 0.24s; transform-origin: 200px 140px; }
    .sub-4 { animation: sub-jump 0.6s ease-in-out infinite 0.36s; transform-origin: 270px 140px; }
    .sub-5 { animation: sub-jump 0.6s ease-in-out infinite 0.48s; transform-origin: 340px 140px; }

    /* === Connections === */
    .connection-line {
      stroke: #4A9EFF;
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      animation: dash-flow 0.8s linear infinite;
      opacity: 0.6;
    }

    /* === Status Dots === */
    .status-dot {
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    .sd-2 { animation-delay: 0.3s; }
    .sd-3 { animation-delay: 0.6s; }
    .sd-4 { animation-delay: 0.9s; }
    .sd-5 { animation-delay: 1.2s; }

    /* === Labels === */
    .label {
      font-family: monospace, 'Courier New';
      font-size: 7px;
      fill: #50FA7B;
      text-anchor: middle;
      opacity: 0.8;
    }
    .title-text {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 9px;
      fill: #8B8F96;
    }
  </style>

  <!-- ======================== -->
  <!-- TERMINAL WINDOW (GHOSTTY) -->
  <!-- ======================== -->

  <!-- Window background -->
  <rect x="2" y="2" width="396" height="176" rx="8" fill="#1C1E26" stroke="#3A3D4A" stroke-width="1"/>

  <!-- Title bar background -->
  <rect x="2" y="2" width="396" height="22" rx="8" fill="#282A36"/>
  <rect x="2" y="16" width="396" height="8" fill="#282A36"/>

  <!-- Traffic light dots -->
  <circle cx="18" cy="13" r="4.5" fill="#FF5F57"/>
  <circle cx="32" cy="13" r="4.5" fill="#FFBD2E"/>
  <circle cx="46" cy="13" r="4.5" fill="#28CA42"/>

  <!-- Ghostty mini ghost icon (simplified) -->
  <g transform="translate(175, 6)">
    <!-- Tiny ghost body -->
    <rect x="0" y="2" width="10" height="6" rx="3" fill="#E8EAED"/>
    <rect x="1" y="7" width="2" height="3" fill="#E8EAED"/>
    <rect x="4" y="7" width="2" height="3" fill="#E8EAED"/>
    <rect x="7" y="7" width="2" height="3" fill="#E8EAED"/>
    <!-- Tiny eyes -->
    <circle cx="3.5" cy="5" r="1" fill="#1C1E26"/>
    <circle cx="7" cy="5" r="1" fill="#1C1E26"/>
  </g>
  <text x="190" y="15" class="title-text">Ghostty</text>

  <!-- ======================== -->
  <!-- CONNECTION LINES         -->
  <!-- ======================== -->
  <g class="connections">
    <line class="connection-line" x1="200" y1="80" x2="60" y2="122"/>
    <line class="connection-line" x1="200" y1="80" x2="130" y2="122"/>
    <line class="connection-line" x1="200" y1="80" x2="200" y2="122"/>
    <line class="connection-line" x1="200" y1="80" x2="270" y2="122"/>
    <line class="connection-line" x1="200" y1="80" x2="340" y2="122"/>
  </g>

  <!-- ======================== -->
  <!-- CLAUDE CODE — MAIN AGENT -->
  <!-- ======================== -->
