  <g class="sub-5">
    <rect x="331" y="120" width="4" height="6" fill="#E8A070"/>
    <rect x="345" y="120" width="4" height="6" fill="#E8A070"/>
    <rect x="330" y="126" width="20" height="2" fill="#E8A070"/>
