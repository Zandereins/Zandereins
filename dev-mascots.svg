    <!-- Left ear -->
    <rect class="main-left-ear" x="181" y="30" width="5" height="10" fill="#E07C4C"/>
    <!-- Right ear -->
    <rect class="main-right-ear" x="214" y="30" width="5" height="10" fill="#E07C4C"/>
    <!-- Body top -->
    <rect x="179" y="40" width="42" height="3" fill="#E07C4C"/>
    <!-- Body main -->
    <rect x="176" y="43" width="48" height="22" fill="#E07C4C"/>
    <!-- Left eye -->
    <rect x="186" y="47" width="6" height="7" fill="#000"/>
    <!-- Right eye -->
    <rect x="208" y="47" width="6" height="7" fill="#000"/>
    <!-- Left arm -->
    <rect class="main-left-arm" x="168" y="48" width="8" height="5" fill="#E07C4C"/>
    <!-- Right arm -->
    <rect class="main-right-arm" x="224" y="48" width="8" height="5" fill="#E07C4C"/>
    <!-- Left leg -->
