name: Star Count

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [star-update]

permissions:
  contents: write

concurrency:
  group: star-count
  cancel-in-progress: false

jobs:
  total-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute total stars across public repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh api --slurp cannot be combined with --jq, so sum the
          # concatenated page arrays with a standalone jq -s instead.
          total=$(gh api --paginate 'users/Zandereins/repos?per_page=100&type=owner' \
            | jq -s '[.[][] | select(.fork == false and .private == false) | .stargazers_count] | add // 0')
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "Unexpected total: '$total' — refusing to write stars.json" >&2
            exit 1
          fi
          echo "Total public stars: $total"
          printf '{"schemaVersion":1,"label":"total stars","message":"%s","color":"blue"}\n' "$total" > stars.json

      - name: Commit if the count changed
        run: |
          if git diff --quiet -- stars.json; then
            echo "No change — star count is still current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stars.json
            git commit -m "chore: update total star count [skip ci]"
            git pull --rebase origin main
            git push
          fi
